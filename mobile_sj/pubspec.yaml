name: san_jose_eam_mobile
description: San Jose GSO Enterprise Asset Management - Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # HTTP + Cookie-based JWT (matches Spring Boot HttpOnly cookie auth)
  dio: ^5.4.3
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8
  path_provider: ^2.1.3

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^13.2.4

  # Report export (Excel / PDF, mirrors web Reports page)
  excel: ^4.0.6
  pdf: ^3.11.1
  printing: ^5.13.1
  share_plus: ^13.2.0

  # QR scan-to-status lookup (camera scanning; Android/iOS/web — falls back to manual
  # entry on desktop platforms mobile_scanner doesn't support, e.g. Windows)
  mobile_scanner: ^7.2.0
  # QR code generation for per-asset labels (on-screen + printable)
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.5
  package_info_plus: ^10.2.0

  # Proactive "you're offline" signal, instead of only discovering connectivity
  # loss reactively after a request fails
  connectivity_plus: ^6.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
