spring.application.name=inventory

# MySQL DataSource — set DB_URL, DB_USERNAME, DB_PASSWORD env vars in production
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/inventory_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server
server.port=8080

# JWT — set JWT_SECRET env var in production (min 32 chars, cryptographically random)
jwt.secret=${JWT_SECRET:InventorySystemSecretKey2024SanJoseMunicipalHallICT}
jwt.expiration=28800000
